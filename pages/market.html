<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market</title>

    <!-- Link to CSS for styling -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Inline CSS specific to this page -->
    <style>
        body {
            background-image: url(../images/brown_paper_bg.avif);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
        }
    </style>

    <!-- Audio files for sound effects -->
    <audio id="BGM-1" loop>
        <source src="../music/BGM-1.m4a" type="audio/mpeg">
    </audio>
    <audio id="coin">
        <source src="../music/coin-flip.mp3" type="audio/mpeg">
    </audio>
    <audio id="preview">
        <source src="../music/normalSound.wav" type="audio/mpeg">
    </audio>
</head>
<body>
    <!-- Side navigation bar for page navigation -->
    <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="../index.html" class="menu_item">HOME</a>
        <a href="market.html" class="menu_item">MARKET</a>
        <a href="contact.html" class="menu_item">CONTACT</a>
        <a href="about.html" class="menu_item">ABOUT</a>
    </div>

    <!-- Top navigation bar with menu icon -->
    <div class="top_bar">
        <div class="menu_container" onclick="openNav()">
            <div class="bar1"></div>
            <div class="bar2"></div>
            <div class="bar3"></div>
        </div>
    </div>

    <!-- Main content for market items -->
    <div class="tier-0-items">
        <div class="item_list">
            <!-- Displays the amount of gold the player has -->
            <div class="gold_plate_background">
                <img class="stats_icon" src="../images/noun-coin-6929625.png" alt="Coin Icon">
                <span id="market_gold">Gold: 0</span>
            </div>

            <!-- List of purchasable items with corresponding buttons -->
            <button id="wood_sword" class="market_item" onclick="drawAnimation(w_Sword, 'Wood Sword')">Wood Sword</button>
            <button id="wood_pickaxe" class="market_item" onclick="drawAnimation(w_pickaxe, 'Wood Pickaxe')">Wood Pickaxe</button>
            <button id="iron_pickaxe" class="market_item" onclick="drawAnimation(i_pickaxe, 'Iron Pickaxe')">Iron Pickaxe</button>
            <button id="emerald_pickaxe" class="market_item" onclick="drawAnimation(e_pickaxe, 'Emerald Pickaxe')">Emerald Pickaxe</button>
            <button id="epic_sword" class="market_item" onclick="drawAnimation(epicSword, 'Epic Sword')">Epic Sword</button>
            <button id="diamond_sword" class="market_item" onclick="drawAnimation(d_Sword, 'Diamond Sword')">Diamond Sword</button>
            <button id="genki_dama" class="market_item" onclick="drawAnimation(genkidama, 'Genki Dama')">Genki Dama</button>
            <button id="dirty_icecream" class="market_item" onclick="drawAnimation(dirtyIceCream, 'Dirty Ice Cream')">Dirty Ice Cream</button>
            <button id="helmet" class="market_item" onclick="drawAnimation(helmet, 'Helmet')">Helmet</button>
            <button id="normal_armor" class="market_item" onclick="drawAnimation(n_armor, 'Normal Armor')">Normal Armor</button>
            <button id="epic_armor" class="market_item" onclick="drawAnimation(e_armor, 'Epic Armor')">Epic Armor</button>
            <button id="play_audio_1" onclick="togglePlayPause()">Play BGM</button>
            <button id="play_fx_market" onclick="playFxMarket()">Play Sound</button>
        </div>
    </div>

    <!-- Canvas to display item visuals -->
    <div class="canvas_list">
        <canvas id="market_canvas"></canvas>
    </div>

    <!-- Button to purchase the selected item -->
    <button id="purchaseItem" onclick="purchaseItem()">PURCHASE</button>

    <!-- Display stats of the selected item -->
    <div class="canvas_stats">
        <div>
            <img class="market_icons" src="../images/noun-coin-6929625.png" alt="Coin Icon">
            <span class="market_price" id="market_price">Price:</span>
        </div>
        <div>
            <img class="market_icons" src="../images/noun-fist-6352698.png" alt="Fist Icon">
            <span id="dmg_display">Damage:</span>
        </div>
        <br>
        <img class="market_icons heart_icon" src="../images/noun-heart-7121411.png" alt="Heart Icon">
        <span id="hp_display">HP: +</span>
    </div>

    <!-- Scripts for market and clicker functionalities -->
    <script src="../scripts/market.js"></script>
    <script src="../scripts/clicker.js"></script>

    <!-- Store image and additional content -->
    <div class="store_image">
        <img src="../images/market_store.png" id="market_store" alt="Market Store">
        <img src="../images/text.png" id="market_text" alt="Market Text">
        <div id="random_text">I'm J_J</div>
    </div>
</body>
</html>
